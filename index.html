<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fb regesration</title>
    <style>
        label {
            display: inline-block;
            width: 100px;
        }

        button {
            background-color: greenyellow;
            margin-left: 155px;
            color: white;
            padding: 10px 20px;

        }
        fieldset{
            width: 400px;
            height: auto;
            margin: 50px auto;
            padding: 30px;
            background-color: rgb(177, 222, 241);
        }
        body{
            background-color: blue;
        }
        
    </style>
</head>

                    <option>select gender</option>
                    <option value="male">male</option>

                </select>


            </p>

                <label>Birthday:</label>

                    <option>Month</option>

                    <option>February</option>
                    <option>March</option>
                    <option>April</option>
                    <option>May</option>
                    <option>June</option>
                    <option>July</option>
                    <option>August</option>
                    <option>September</option>
                    <option>October</option>
                    <option>November</option>
                    <option>December</option>
                </select>

                <select>
                    <option>Day</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    
                </select>

                <select>
                    <option>Year</option>
                    <option>2006</option>
                    <option>2005</option>
                    <option>2004</option>
                    <option>2003</option>
                    <option>2000</option>
                </select>


            </p><br>
            <p>

        </fieldset>

</body>

</html>
